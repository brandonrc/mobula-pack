{{- include "mobula.validateAuth" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobula.name" . }}
  labels: {{- include "mobula.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.database.kind "postgres" }}
  # Postgres store (mobula#104): multiple writers are safe, so run
  # replicaCount pods behind a RollingUpdate for HA and zero-downtime rolls.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  {{- else }}
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount>1 requires database.kind=postgres (SQLite is a single writer on an RWO PVC)" }}
  {{- end }}
  # Recreate, not RollingUpdate: state is SQLite on an RWO PVC — a second
  # writer during a roll would either fail to attach the volume or corrupt
  # the database. Single replica.
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mobula.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "mobula.labels" . | nindent 8 }}
        # Marks this as a Mobula control-plane pod (#86/#91): the tenant-allow
        # NetworkPolicy admits ingress to Ray heads' 8265/10001 only from pods
        # carrying this label, so the nodes/jobs/metrics proxies can reach the
        # cluster's Ray dashboard/Job API.
        mobula.dev/control-plane: "true"
      annotations:
        checksum/registry: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/auth: {{ include (print $.Template.BasePath "/auth-configmap.yaml") . | sha256sum }}
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mobula.serviceAccountName" . }}
      # Restricted pod-security profile (Mobula ADR-0008: STIG posture).
      # fsGroup makes the PVC writable for the non-root uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mobula
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - serve
            - --bind={{ .Values.bind }}
            {{- if .Values.clusters }}
            - --registry=/etc/mobula/registry/clusters.toml
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - --auth-config=/etc/mobula/auth/auth.toml
            {{- else if eq .Values.auth.mode "local" }}
            - --local-auth
            {{- else }}
            # auth.mode=none, explicitly confirmed via
            # auth.dangerousDevAllowUnauthenticated (validated in _helpers).
            - --dev-allow-unauthenticated
            {{- end }}
            {{- if .Values.allowInsecureTransport }}
            - --allow-insecure-transport
            {{- end }}
            {{- if eq .Values.database.kind "postgres" }}
            - --db={{ required "database.postgres.dsn is required when database.kind=postgres" .Values.database.postgres.dsn }}
            {{- else }}
            - --db=/data/mobula.db
            {{- end }}
            {{- if and .Values.auditLog.enabled (eq .Values.database.kind "sqlite") }}
            # File audit sink only for the single-writer SQLite backend. With
            # Postgres/HA the audit trail persists to the audit_events table
            # (served by GET /api/v1/audit); a shared file across replicas
            # would interleave writes.
            - --audit-log=/data/audit.jsonl
            {{- end }}
            {{- if .Values.kuberay.enabled }}
            - --kuberay-namespace={{ include "mobula.kuberayNamespace" . }}
            {{- end }}
            {{- if .Values.policy.enabled }}
            - --policy=/etc/mobula/policy/policy.toml
            {{- end }}
          {{- if and (eq .Values.auth.mode "local") .Values.auth.local.existingSecret }}
          env:
            - name: MOBULA_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.existingSecret }}
                  key: {{ .Values.auth.local.passwordKey | default "MOBULA_LOCAL_ADMIN_PASSWORD" }}
          {{- end }}
          {{- if .Values.registryTokenSecret }}
          # Secret keys become env vars; clusters[].auth_token_env names them.
          envFrom:
            - secretRef:
                name: {{ .Values.registryTokenSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8484
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.clusters }}
            - name: registry
              mountPath: /etc/mobula/registry
              readOnly: true
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: auth
              mountPath: /etc/mobula/auth
              readOnly: true
            {{- end }}
            {{- if .Values.policy.enabled }}
            - name: policy
              mountPath: /etc/mobula/policy
              readOnly: true
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if and (eq .Values.database.kind "sqlite") .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mobula.name" . }}-data
          {{- else }}
          # Postgres backend (or persistence disabled): /data is scratch only
          # (no SQLite file, no shared audit file). emptyDir keeps it per-pod.
          emptyDir: {}
          {{- end }}
        {{- if .Values.clusters }}
        - name: registry
          configMap:
            name: {{ include "mobula.name" . }}-registry
        {{- end }}
        {{- if eq .Values.auth.mode "oidc" }}
        - name: auth
          configMap:
            name: {{ include "mobula.name" . }}-auth
        {{- end }}
        {{- if .Values.policy.enabled }}
        - name: policy
          configMap:
            name: {{ include "mobula.name" . }}-policy
        {{- end }}
