apiVersion: v1
kind: Service
metadata:
  name: {{ include "mobula.name" . }}
  labels: {{- include "mobula.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "mobula.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8484
      targetPort: http
