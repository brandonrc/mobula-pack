{{- if .Values.persistence.enabled }}
# SQLite state (--db=/data/mobula.db) + optional audit log. RWO: the
# Deployment runs a single replica with strategy Recreate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mobula.name" . }}-data
  labels: {{- include "mobula.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
