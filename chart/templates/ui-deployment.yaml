{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobula.ui.name" . }}
  labels: {{- include "mobula.ui.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mobula.ui.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "mobula.ui.labels" . | nindent 8 }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum }}
    spec:
      # Looser than the mobula container's restricted posture, deliberately:
      # the image is stock nginx:alpine, whose entrypoint runs as root to
      # bind :80 and chown its cache dirs before dropping workers to the
      # nginx user. We keep no-privilege-escalation + a minimal capability
      # set instead of runAsNonRoot/readOnlyRootFilesystem (which would need
      # a rebuilt nginx-unprivileged image).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            # Shadow the image's baked conf (hardcoded compose upstream) with
            # the chart-rendered one pointing at this release's mobula Service.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "mobula.ui.name" . }}-nginx
{{- end }}
